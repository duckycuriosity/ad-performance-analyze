<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ad Performance Aggregator</title>
    <style>
        body { margin: 0; background: #f6f7f9; color: #1d2330; font: 15px/1.5 system-ui, sans-serif; }
        main { max-width: 960px; margin: 0 auto; padding: 32px 16px; }
        h1 { font-size: 24px; margin: 0 0 4px; }
        h2 { font-size: 17px; margin: 0 0 12px; display: flex; justify-content: space-between; gap: 12px; }
        h2 a { font-size: 14px; font-weight: normal; }
        .lead, .muted { color: #5c6475; }
        .card { background: #fff; border: 1px solid #dde1e8; border-radius: 10px; padding: 20px; margin: 20px 0; }
        button { background: #2457d6; color: #fff; border: 0; border-radius: 6px; padding: 8px 18px; font: inherit; cursor: pointer; }
        button:disabled { opacity: .5; }
        .error { color: #a12121; }
        .table-wrap { overflow-x: auto; }
        table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
        th, td { padding: 6px 10px; border-bottom: 1px solid #dde1e8; text-align: right; white-space: nowrap; }
        th:first-child, td:first-child { text-align: left; }
        th { color: #5c6475; font-size: 13px; }
        [hidden] { display: none; }
    </style>
</head>
<body>
<main>
    <h1>Ad Performance Aggregator</h1>
    <p class="lead">Upload a CSV with the columns <code>campaign_id, date, impressions, clicks, spend, conversions</code> in any order.</p>

    <form class="card" id="form">
        <input type="file" id="file" accept=".csv,text/csv" required>
        <button id="submit">Analyse</button>
        <p id="status" class="muted"></p>
    </form>

    <div id="results" hidden>
        <section class="card">
            <h2>Summary</h2>
            <p id="summary"></p>
            <ul id="skipped" class="muted"></ul>
        </section>
        <section class="card">
            <h2>Top 10 by highest CTR <a id="download-ctr" download="top10_ctr.csv">Download CSV</a></h2>
            <div class="table-wrap"><table id="table-ctr"></table></div>
        </section>
        <section class="card">
            <h2>Top 10 by lowest CPA <a id="download-cpa" download="top10_cpa.csv">Download CSV</a></h2>
            <div class="table-wrap"><table id="table-cpa"></table></div>
        </section>
    </div>
</main>
<script>
    const $ = id => document.getElementById(id);

    $('form').addEventListener('submit', async event => {
        event.preventDefault();
        const file = $('file').files[0];
        $('submit').disabled = true;
        $('results').hidden = true;
        $('status').className = 'muted';
        $('status').textContent = `Uploading and analysing ${file.name}…`;
        try {
            const response = await fetch('/analyze', { method: 'POST', body: file });
            const report = await response.json();
            if (!response.ok) throw new Error(report.error);
            $('status').textContent = `Done: ${file.name}`;
            render(report);
        } catch (error) {
            $('status').className = 'error';
            $('status').textContent = error.message;
        } finally {
            $('submit').disabled = false;
        }
    });

    function render(report) {
        const n = value => value.toLocaleString();
        $('summary').textContent = `${n(report.dataRows)} data rows, ${n(report.validRows)} valid, `
            + `${n(report.skippedRows)} skipped, ${n(report.campaigns)} campaigns, `
            + `processed in ${(report.elapsedMillis / 1000).toFixed(2)} s.`;
        $('skipped').replaceChildren(...report.skipped.map(text => cell('li', text)));
        showCsv(report.topCtrCsv, $('table-ctr'), $('download-ctr'));
        showCsv(report.topCpaCsv, $('table-cpa'), $('download-cpa'));
        $('results').hidden = false;
    }

    function showCsv(csv, table, link) {
        const [header, ...rows] = csv.trim().split('\n').map(line => line.split(','));
        const tr = (cells, tag) => {
            const row = document.createElement('tr');
            row.append(...cells.map(text => cell(tag, text)));
            return row;
        };
        table.replaceChildren(tr(header, 'th'), ...rows.map(cells => tr(cells, 'td')));
        URL.revokeObjectURL(link.href);
        link.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    }

    function cell(tag, text) {
        const node = document.createElement(tag);
        node.textContent = text;
        return node;
    }
</script>
</body>
</html>
