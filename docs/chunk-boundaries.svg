<svg xmlns="http://www.w3.org/2000/svg" width="680" height="250" viewBox="0 0 680 250" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img">
  <title>Aligning chunk boundaries to line starts</title>
  <desc>The data bytes are cut into three equal parts. Each cut that falls inside a line is moved forward to the start of the next line, so every line belongs to exactly one worker.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="250" rx="12" fill="#FFFFFF"/>

  <text x="40" y="34" font-size="12" fill="#5F5E5A">Data bytes after the header (each box is one CSV line ending in \n)</text>

  <g fill="#F1EFE8" stroke="#888780" stroke-width="0.8">
    <rect x="40" y="70" width="70" height="36"/>
    <rect x="110" y="70" width="95" height="36"/>
    <rect x="205" y="70" width="80" height="36"/>
    <rect x="285" y="70" width="90" height="36"/>
    <rect x="375" y="70" width="75" height="36"/>
    <rect x="450" y="70" width="85" height="36"/>
    <rect x="535" y="70" width="105" height="36"/>
  </g>
  <g font-size="11" fill="#888780" text-anchor="middle">
    <text x="75" y="92">line 1</text>
    <text x="157" y="92">line 2</text>
    <text x="234" y="92">line 3</text>
    <text x="330" y="92">line 4</text>
    <text x="412" y="92">line 5</text>
    <text x="492" y="92">line 6</text>
    <text x="587" y="92">line 7</text>
  </g>

  <line x1="268" y1="52" x2="268" y2="116" stroke="#BA7517" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="440" y1="52" x2="440" y2="116" stroke="#BA7517" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="285" y1="52" x2="285" y2="116" stroke="#0F6E56" stroke-width="2"/>
  <line x1="450" y1="52" x2="450" y2="116" stroke="#0F6E56" stroke-width="2"/>
  <line x1="268" y1="126" x2="281" y2="126" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="126" x2="446" y2="126" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="40" y="146" width="243" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
    <text x="161" y="163" text-anchor="middle" font-size="12" fill="#085041">Worker 1: lines 1–3</text>
    <rect x="287" y="146" width="161" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
    <text x="367" y="163" text-anchor="middle" font-size="12" fill="#085041">Worker 2: lines 4–5</text>
    <rect x="452" y="146" width="188" height="26" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
    <text x="546" y="163" text-anchor="middle" font-size="12" fill="#085041">Worker 3: lines 6–7</text>
  </g>

  <line x1="40" y1="206" x2="64" y2="206" stroke="#BA7517" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="72" y="210" font-size="12" fill="#5F5E5A">Equal-size cut (may fall inside a line)</text>
  <line x1="340" y1="206" x2="364" y2="206" stroke="#0F6E56" stroke-width="2"/>
  <text x="372" y="210" font-size="12" fill="#5F5E5A">Adjusted cut: just after the next \n</text>
</svg>
